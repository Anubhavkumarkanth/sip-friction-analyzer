# Render Blueprint: one Docker web service (API + built frontend on one origin)
# and one PostgreSQL database. See DEPLOYMENT.md.
services:
  - type: web
    name: sip-friction-analyzer
    runtime: docker
    plan: free
    healthCheckPath: /api
    envVars:
      # Render's connection string starts with postgresql://, which SQLAlchemy
      # opens with psycopg2, the driver in requirements.txt.
      - key: DATABASE_URL
        fromDatabase:
          name: sip-db
          property: connectionString
      # Generated once and kept across deploys, so tokens survive restarts.
      - key: SECRET_KEY
        generateValue: true
      # Asked for in the dashboard on first sync; never committed.
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false

databases:
  - name: sip-db
    plan: free
    postgresMajorVersion: "16"
